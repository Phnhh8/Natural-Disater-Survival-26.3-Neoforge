plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

def neoConf = configurations.detachedConfiguration(dependencies.create("net.neoforged:neoforge:[26.3,26.4)"))
neoConf.transitive = false
def resolvedNeoVersion = neoConf.resolvedConfiguration.firstLevelModuleDependencies.first().moduleVersion

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = resolvedNeoVersion
    runs {
        client { client() }
        server { server() }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
