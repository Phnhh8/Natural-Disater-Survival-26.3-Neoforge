plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.0.0'
group = 'com.example.disasters'
base.archivesName = 'naturaldisasters-neoforge-26.1.1'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.1.1.1-beta'

    runs {
        client { client() }
        server { server() }
    }

    mods {
        naturaldisasters {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def generatedResourcesDir = layout.buildDirectory.dir("generated/resources")

tasks.register('generateAssets') {
    outputs.dir(generatedResourcesDir)
    doLast {
        def baseDir = new File(generatedResourcesDir.get().asFile, "assets/naturaldisasters")
        new File(baseDir, "items").mkdirs()
        new File(baseDir, "models/item").mkdirs()

        def icons = [
            meteor_caller: "fire_charge", earthquake_caller: "flint", acid_rain_caller: "slime_ball",
            tornado_caller: "feather", landslide_caller: "clay_ball", nuke_caller: "tnt",
            tsunami_caller: "water_bucket", volcano_caller: "magma_cream", sinkhole_caller: "ender_pearl",
            lightning_caller: "blaze_rod", blizzard_caller: "snowball", zombie_caller: "rotten_flesh",
            disaster_stopper: "barrier"
        ]
        icons.each { id, tex ->
            if (id == "nuke_caller" || id == "disaster_stopper") {
                String blockModel = (id == "nuke_caller") ? "minecraft:block/tnt" : "minecraft:item/barrier"
                new File(baseDir, "items/${id}.json").setText("""{"model":{"type":"minecraft:model","model":"${blockModel}"}}""", 'UTF-8')
            } else {
                new File(baseDir, "items/${id}.json").setText("""{"model":{"type":"minecraft:model","model":"naturaldisasters:item/${id}"}}""", 'UTF-8')
                new File(baseDir, "models/item/${id}.json").setText("""{"parent":"minecraft:item/generated","textures":{"layer0":"minecraft:item/${tex}"}}""", 'UTF-8')
            }
        }
    }
}

sourceSets.main.resources.srcDir(generatedResourcesDir)
processResources {
    dependsOn('generateAssets')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
